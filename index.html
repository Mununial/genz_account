<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen-Z University - Finance System</title>
  <meta http-equiv="refresh" content="0; url=/login.html">
  <script>
    // If auth token exists, let frontend router handle, otherwise straight to login
    const token = localStorage.getItem('bec_auth_token') || sessionStorage.getItem('bec_auth_token');
    if (token) {
      window.location.replace('/frontend/index.html');
    } else {
      window.location.replace('/login.html');
    }
  </script>
</head>
<body style="background:#0F172A; color:#FFFFFF; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <h2 style="margin:0 0 10px 0; font-size:1.4rem;">Gen-Z University ERP</h2>
    <p style="color:#94A3B8; margin:0;">Redirecting to secure portal...</p>
  </div>
</body>
</html>
